<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio-Bridge | Studio Localization & Dubbing Console</title>
    <style>
        :root {
            --bg-base: #0c0f14;
            --surface: #141923;
            --surface-hover: #1c2433;
            --border: #263248;
            --accent-amber: #f59e0b;
            --accent-green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }
        .console-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 1.5rem; color: var(--accent-amber); margin-top: 0; display: flex; align-items: center; gap: 0.5rem; }
        .control-group { margin-bottom: 1.5rem; }
        label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
        select, input[type="file"], input[type="text"] {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
        }
        button {
            background: var(--accent-amber);
            color: #000;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        #progress-panel { display: none; margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.5rem; }
        .vu-meter-bar { height: 8px; background: var(--bg-base); border-radius: 4px; overflow: hidden; margin-top: 0.5rem; border: 1px solid var(--border); }
        .vu-fill { height: 100%; width: 0%; background: var(--accent-green); transition: width 0.4s ease; }
        .artifact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
        .artifact-card { background: var(--surface-hover); border: 1px solid var(--border); padding: 1rem; border-radius: 6px; text-align: center; }
        .artifact-card a { color: var(--accent-amber); text-decoration: none; font-weight: bold; display: inline-block; margin-top: 0.5rem; }
        .ai-panel { margin-top: 2rem; background: var(--surface-hover); border: 1px solid var(--border); padding: 1.5rem; border-radius: 8px; display: none; }
    </style>
</head>
<body>
    <div class="console-container">
        <h1>🎛️ Audio/Video Bridge Localization Console</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Upload media to generate synchronized SRT subtitles, localized translations, and AI voice dubs.</p>
        
        <div class="control-group">
            <label>Source Media File (Video / Audio)</label>
            <input type="file" id="mediaFile" accept=".mp4,.mov,.mp3,.wav,.m4a,.webm">
        </div>

        <div class="control-group">
            <label>Source Spoken Language (Hint)</label>
            <select id="sourceLang">
                <option value="auto">Auto-Detect </option>
                <option value="hi">Hindi (हिन्दी)</option>
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="zh">Chinese (Mandarin)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Target Language</label>
            <select id="targetLang">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="hi">Hindi</option>
                <option value="zh">Chinese (Mandarin)</option>
            </select>
        </div>

        <button onclick="startJob()">🚀 Initialize Processing Pipeline</button>

        <div id="progress-panel">
            <div id="status-message" style="font-size: 0.9rem; margin-bottom: 0.5rem;">Initializing...</div>
            <div class="vu-meter-bar"><div class="vu-fill" id="vuFill"></div></div>
            
            <div id="results-section" style="display: none;">
                <h3 style="margin-top: 2rem; font-size: 1.1rem; color: var(--accent-green);">Output Channels & Artifacts</h3>
                <div class="artifact-grid" id="artifactGrid"></div>
            </div>

            <!-- AI Video Intelligence & Chat Panel -->
            <div id="ai-features-panel" class="ai-panel">
                <h3 style="color: var(--accent-amber); margin-top: 0; font-size: 1.1rem;">✨ AI Video Intelligence & Chat</h3>
                
                <!-- Summary Section -->
                <div style="margin-bottom: 1.5rem;">
                    <button onclick="loadSummary()" style="width: auto; background: var(--accent-amber); padding: 0.5rem 1rem; font-size: 0.85rem;">Generate Video Summary</button>
                    <div id="summary-output" style="margin-top: 0.75rem; color: var(--text-main); white-space: pre-wrap; background: var(--bg-base); padding: 0.75rem; border-radius: 4px; border: 1px solid var(--border); font-size: 0.9rem;"></div>
                </div>

                <!-- Chat Section -->
                <div>
                    <label style="margin-bottom: 0.5rem;">Chat with this Video:</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="text" id="chat-question" placeholder="Ask a question about the video contents..." />
                        <button onclick="sendChat()" style="width: auto; background: var(--accent-green); color: #fff; padding: 0.5rem 1rem; font-size: 0.85rem;">Ask AI</button>
                    </div>
                    <div id="chat-output" style="margin-top: 0.75rem; color: var(--text-main); background: var(--bg-base); padding: 0.75rem; border-radius: 4px; border: 1px solid var(--border); min-height: 30px; font-size: 0.9rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let activeJobId = "";

        async function startJob() {
            const fileInput = document.getElementById('mediaFile');
            const sourceLang = document.getElementById('sourceLang').value;
            const targetLang = document.getElementById('targetLang').value;
            
            if (!fileInput.files.length) {
                alert('Please select a media file first.');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('source_language', sourceLang);
            formData.append('target_language', targetLang);

            document.getElementById('progress-panel').style.display = 'block';
            document.getElementById('results-section').style.display = 'none';
            document.getElementById('ai-features-panel').style.display = 'none';
            document.getElementById('status-message').innerText = 'Uploading media to server...';
            document.getElementById('vuFill').style.width = '5%';

            try {
                const res = await fetch('/api/jobs', { method: 'POST', body: formData });
                if (!res.ok) throw new Error(await res.text());
                const data = await res.json();
                activeJobId = data.job_id;
                pollJob(activeJobId);
            } catch (err) {
                alert('Job creation failed: ' + err.message);
            }
        }

        async function pollJob(jobId) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/jobs/${jobId}`);
                    const job = await res.json();

                    document.getElementById('status-message').innerText = `[${job.status.toUpperCase()}] ${job.stage_message}`;
                    document.getElementById('vuFill').style.width = `${job.progress}%`;

                    if (job.status === 'completed') {
                        clearInterval(interval);
                        renderArtifacts(job.artifacts);
                        document.getElementById('ai-features-panel').style.display = 'block';
                    } else if (job.status === 'failed') {
                        clearInterval(interval);
                        alert('Pipeline execution failed: ' + job.error);
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 2000);
        }

        async function loadSummary() {
            if (!activeJobId) {
                alert("Please process a job first!");
                return;
            }
            document.getElementById("summary-output").innerText = "Analyzing transcript and generating summary...";
            try {
                let res = await fetch(`/api/jobs/${activeJobId}/summary`);
                let data = await res.json();
                document.getElementById("summary-output").innerText = data.summary || data.detail || "Error generating summary.";
            } catch (err) {
                document.getElementById("summary-output").innerText = "Failed to connect to backend summary service.";
            }
        }

        async function sendChat() {
            if (!activeJobId) {
                alert("Please process a job first!");
                return;
            }
            let question = document.getElementById("chat-question").value;
            if (!question) return;

            document.getElementById("chat-output").innerText = "Thinking...";
            try {
                let res = await fetch(`/api/jobs/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ job_id: activeJobId, question: question })
                });
                let data = await res.json();
                document.getElementById("chat-output").innerText = data.answer || data.detail || "No response received.";
            } catch (err) {
                document.getElementById("chat-output").innerText = "Failed to communicate with chat service.";
            }
        }

        function renderArtifacts(artifacts) {
            const grid = document.getElementById('artifactGrid');
            grid.innerHTML = '';
            for (const [name, url] of Object.entries(artifacts)) {
                grid.innerHTML += `
                    <div class="artifact-card">
                        <div style="font-size:0.85rem; color:var(--text-muted);">${name.toUpperCase()}</div>
                        <a href="${url}" download>📥 Download</a>
                    </div>
                `;
            }
            document.getElementById('results-section').style.display = 'block';
        }
    </script>
</body>
</html>
